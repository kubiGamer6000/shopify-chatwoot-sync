spec_version: 2
name: shopify-chatwoot-sync

services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: main
      deploy_on_push: true

    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

    http_port: 8080

    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    envs:
      - key: SHOPIFY_STORE_DOMAIN
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SHOPIFY_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SHOPIFY_CLIENT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CHATWOOT_BASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CHATWOOT_API_TOKEN
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CHATWOOT_ACCOUNT_ID
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CHATWOOT_INBOX_ID
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SYNC_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SYNC_INTERVAL_HOURS
        scope: RUN_AND_BUILD_TIME
        value: "6"
      - key: ANTHROPIC_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SEVENTEENTRACK_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SKIO_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DASHBOARD_APP_TOKEN
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: FIREBASE_BASE64_SERVICE_ACCOUNT
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CLAUDE_CLASSIFIER_MODEL
        scope: RUN_AND_BUILD_TIME
        value: "claude-haiku-4-5"
      - key: CHATWOOT_AGENT_BOT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: AGENT_BOT_HOLDING_REPLY
        scope: RUN_AND_BUILD_TIME
        value: "true"
      # Comma-separated Google emails that are always admins in the Admin
      # Control Dashboard (bootstraps the first approver).
      - key: ADMIN_BOOTSTRAP_EMAILS
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      # Firebase Web config for the admin SPA. Public by design (identifies, not
      # authorizes) and baked into the build, so these are BUILD_TIME env.
      - key: VITE_FIREBASE_API_KEY
        scope: BUILD_TIME
        value: "AIzaSyDYewHtIpPWtU_hB4n4GJAeWccVJTZDoH8"
      - key: VITE_FIREBASE_AUTH_DOMAIN
        scope: BUILD_TIME
        value: "kybalion-pb.firebaseapp.com"
      - key: VITE_FIREBASE_PROJECT_ID
        scope: BUILD_TIME
        value: "kybalion-pb"
      - key: VITE_FIREBASE_STORAGE_BUCKET
        scope: BUILD_TIME
        value: "kybalion-pb.firebasestorage.app"
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        scope: BUILD_TIME
        value: "710083096792"
      - key: VITE_FIREBASE_APP_ID
        scope: BUILD_TIME
        value: "1:710083096792:web:01e9717d5672ef54e567ad"
